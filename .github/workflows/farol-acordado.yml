name: Farol acordado
# Mantem o Farol (Render gratuito) acordado das 8h as 23h de Brasilia.
# Fora desse horario ele dorme, para nao gastar as 750 horas mensais do plano.
on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-1 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -o /dev/null -m 90 --retry 2 https://farol-kqs5.onrender.com/api/mapas
